var bounds=[];
function layer(arr){var g=L.markerClusterGroup({maxClusterRadius:45});
 arr.forEach(function(p){var c=COL[p[4]];
  var m=L.circleMarker([p[0],p[1]],{radius:5,color:c,weight:1,fillColor:c,fillOpacity:.85});
  m.bindPopup('<b>'+p[2]+'</b><br>'+(p[3]||'')+'<br><span style="color:'+c+'">'+TXT[p[4]]+'</span>');
  g.addLayer(m);bounds.push([p[0],p[1]]);});return g;}
